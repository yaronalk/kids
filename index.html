<!DOCTYPE html>
<html lang="cs">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="color-scheme" content="light">
  <title>Ztratil(a) jsem se · I'm lost</title>
  <style>
    :root {
      --paper: #ffffff;
      --ink: #1a1a1a;
      --muted: #5a5a5a;
      --line: #e3e3e3;
      --soft: #f0f0f0;
      --signal: #c4161c;
      --signal-tint: #fdebea;
      --call: #167a3b;
      --chat: #0e7c6e;
      --loc: #1b5cb8;
      --r: 16px;
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 18px;
      line-height: 1.35;
      -webkit-text-size-adjust: 100%
    }

    main {
      max-width: 540px;
      margin: 0 auto;
      padding: 14px 16px 48px
    }

    /* Every text block is a Czech/English couplet: Czech heavy, English lighter and smaller. */
    .cs {
      display: block
    }

    .en {
      display: block;
      color: var(--muted);
      font-size: .88em;
      font-weight: 500
    }

    .banner {
      background: var(--signal-tint);
      border: 2px solid var(--signal);
      border-radius: var(--r);
      padding: 16px 18px;
      margin-bottom: 16px
    }

    .banner .cs {
      color: var(--signal);
      font-size: 26px;
      font-weight: 800;
      line-height: 1.2
    }

    .banner .en {
      color: var(--signal);
      opacity: .9;
      font-size: 18px;
      margin-top: 6px
    }

    .card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 16px 18px;
      margin-bottom: 12px
    }

    .kid {
      display: flex;
      gap: 16px;
      align-items: flex-start
    }

    .kid img {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      flex: none;
      border: 2px solid var(--line)
    }

    .kid h1 {
      font-size: 38px;
      font-weight: 800;
      line-height: 1.05;
      margin: 0 0 10px;
      letter-spacing: -.01em;
      word-break: break-word
    }

    .meta div {
      margin-top: 8px
    }

    .note {
      background: var(--soft);
      border-radius: 12px;
      padding: 12px 14px;
      margin-top: 14px
    }

    .note b {
      display: block;
      font-size: 14px;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 4px
    }

    h2 {
      font-size: 14px;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
      margin: 24px 4px 8px
    }

    .hint {
      font-size: 15px;
      color: var(--muted);
      margin: 0 4px 10px
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      min-height: 64px;
      padding: 12px 16px;
      border-radius: 14px;
      border: 0;
      text-decoration: none;
      color: #fff;
      background: var(--call);
      font: inherit;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
      margin: 0 0 10px;
      -webkit-tap-highlight-color: rgba(0, 0, 0, .1)
    }

    .btn .cs {
      font-size: 20px
    }

    .btn .en {
      color: rgba(255, 255, 255, .85);
      font-size: 15px
    }

    .btn svg {
      width: 26px;
      height: 26px;
      flex: none;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .btn.chat {
      background: var(--chat)
    }

    .btn.loc {
      background: var(--loc)
    }

    .btn.soft {
      background: var(--soft);
      color: var(--ink)
    }

    .btn.soft .en {
      color: var(--muted)
    }

    .btn:focus-visible {
      outline: 3px solid var(--ink);
      outline-offset: 2px
    }

    .row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px
    }

    .row .btn {
      margin-bottom: 0
    }

    .parent {
      margin-bottom: 12px
    }

    .num {
      font-size: 15px;
      color: var(--muted);
      margin: 6px 4px 0
    }

    #loc-status {
      font-size: 15px;
      color: var(--muted);
      margin: 0 4px 10px;
      min-height: 1.2em
    }

    #loc-panel {
      display: none
    }

    #loc-panel.show {
      display: block
    }

    .link {
      word-break: break-all;
      font-size: 15px;
      background: #fff;
      border: 1px dashed #bdbdbd;
      border-radius: 10px;
      padding: 10px 12px;
      margin: 0 0 10px
    }

    .foot {
      margin-top: 26px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      font-size: 16px
    }

    .foot p {
      margin: 0 0 12px
    }

    .foot .thanks .cs {
      font-size: 22px;
      font-weight: 800
    }
  </style>
</head>

<body>
  <main id="app">
    <noscript>
      <!-- Fallback if JavaScript is unavailable. Also update this number. -->
      <p style="font-size:22px"><b>Ztratil(a) jsem se. Prosím, zavolejte mým rodičům.</b><br>I'm lost. Please call my
        parents.<br>
        <a href="tel:+972500000000">+972 50 000 0000</a>
      </p>
    </noscript>
  </main>

  <script>
    /* ============================ CONFIG — edit only this block ============================ */
    const CONFIG = {
      // The key is what goes in the URL:  .../index.html?k=1  →  kids["1"]
      // Keys can be anything short (numbers, initials, random tokens like "q7x").
      kids: {
        "1": {
          name: "BEN",                     // ← child's name
          age: 10,
          gender: "m",                          // "m" or "f" (affects Czech grammar)
          speaks: { cs: "hebrejsky a trochu anglicky", en: "Hebrew and a little English" },
          notes: { cs: "", en: "" },           // allergies / medical / anything important; empty = hidden
          photo: ""                            // e.g. "kid1.jpg" placed next to index.html; empty = hidden
        },
        "2": {
          name: "ARIELLE",
          age: 9,
          gender: "f",
          speaks: { cs: "hebrejsky", en: "Hebrew" },
          notes: { cs: "", en: "" },
          photo: ""
        },
        "3": {
          name: "DEAN",
          age: 5,
          gender: "m",
          speaks: { cs: "hebrejsky a anglicky", en: "Hebrew" },
          notes: { cs: "", en: "" },
          photo: ""
        }
      },
      fallback: "3",   // kid shown when the URL has no ?k= (set to null for a generic page)

      parents: [
        { call: { cs: "Zavolat mámě", en: "Call Mom" }, name: "Joanna", phone: "+972546900444", whatsapp: true },
        { call: { cs: "Zavolat tátovi", en: "Call Dad" }, name: "Yaron", phone: "+972547276455", whatsapp: true }
      ],
      locationTo: 0,   // index into parents[]: who receives the "send my location" message

      hotel: { name: "HOTEL NAME", phone: "+420000000000", address: "Ulice 1, 110 00 Praha 1" }, // null = hidden
      email: "family@example.com"   // "" = hidden
    };
    /* ======================================================================================== */

    /* Czech / English strings. {x} is replaced at render time. */
    const T = {
      lostM: { cs: "Ztratil jsem se. Prosím, zavolejte mým rodičům.", en: "I'm lost. Please call my parents." },
      lostF: { cs: "Ztratila jsem se. Prosím, zavolejte mým rodičům.", en: "I'm lost. Please call my parents." },
      lostG: { cs: "Toto dítě se ztratilo. Prosím, zavolejte rodičům.", en: "This child is lost. Please call the parents." },
      age: { cs: "Věk {x}", en: "Age {x}" },
      speaks: { cs: "Mluvím {x}. Nemluvím česky.", en: "I speak {x}. I don't speak Czech." },
      notes: { cs: "Důležité", en: "Important" },
      parents: { cs: "Rodiče", en: "Parents" },
      chat: { cs: "WhatsApp", en: "" },
      locT: { cs: "Pošlete nám svou polohu", en: "Send us your location" },
      locH: { cs: "Otevře WhatsApp nebo SMS s odkazem na mapu.", en: "Opens WhatsApp or SMS with a map link." },
      locB: { cs: "Zjistit mou polohu", en: "Find my location" },
      locW: { cs: "Zjišťuji polohu…", en: "Getting location…" },
      locF: { cs: "Polohu se nepodařilo zjistit. Zavolejte nám prosím.", en: "Couldn't get your location. Please call us." },
      locWA: { cs: "Poslat přes WhatsApp", en: "Send via WhatsApp" },
      locSMS: { cs: "Poslat SMS", en: "Send SMS" },
      locCp: { cs: "Kopírovat odkaz", en: "Copy link" },
      copied: { cs: "Zkopírováno", en: "Copied" },
      stay: { cs: "Naše ubytování", en: "Where we're staying" },
      hotelB: { cs: "Zavolat do hotelu", en: "Call the hotel" },
      mapsB: { cs: "Otevřít v mapách", en: "Open in maps" },
      mailB: { cs: "Napsat e-mail", en: "Send an email" },
      emerg: { cs: "Pokud se nám nedovoláte, zavolejte na linku 158 (Policie ČR) nebo 112.", en: "If you can't reach us, call 158 (police) or 112." },
      stayW: { cs: "Prosím, zůstaňte {x} na místě – dorazíme co nejdříve.", en: "Please stay with {x} where you are – we're on our way." },
      thanks: { cs: "Děkujeme!", en: "Thank you!" }
    };
    const PRON = { cs: { m: "s ním", f: "s ní", x: "s dítětem" }, en: { m: "him", f: "her", x: "the child" } };

    const I = {
      phone: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8.1 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.8 2z"/></svg>',
      chat: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5z"/></svg>',
      pin: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>',
      aim: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/><line x1="12" y1="3" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="21"/><line x1="3" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="21" y2="12"/></svg>',
      mail: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>',
      copy: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>'
    };

    (function render() {
      const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      const fill = (t, x) => ({ cs: t.cs.replace("{x}", x.cs), en: t.en.replace("{x}", x.en) });
      const bi = t => `<span class="cs">${t.cs}</span>` + (t.en ? `<span class="en" lang="en">${t.en}</span>` : "");
      const both = t => `${t.cs} · ${t.en}`;
      const digits = p => String(p).replace(/\D/g, "");
      const btn = (cls, href, icon, t, id) =>
        `<a class="btn ${cls}" href="${href}"${id ? ` id="${id}"` : ""}>${icon}<span>${bi(t)}</span></a>`;

      const key = new URLSearchParams(location.search).get("k") || location.hash.replace("#", "") || CONFIG.fallback;
      const kid = (key && CONFIG.kids[key]) || null;
      const g = kid ? (kid.gender === "f" ? "f" : "m") : "x";
      const pron = { cs: PRON.cs[g], en: PRON.en[g] };
      const kidName = kid ? kid.name : "";

      let h = `<section class="banner" role="alert">${bi(kid ? (g === "f" ? T.lostF : T.lostM) : T.lostG)}</section>`;

      if (kid) {
        const hasNotes = kid.notes && (kid.notes.cs || kid.notes.en);
        h += `<section class="card"><div class="kid">` +
          (kid.photo ? `<img src="${esc(kid.photo)}" alt="">` : "") +
          `<div style="min-width:0"><h1>${esc(kid.name)}</h1><div class="meta">` +
          (kid.age != null ? `<div>${both(fill(T.age, { cs: esc(kid.age), en: esc(kid.age) }))}</div>` : "") +
          (kid.speaks ? `<div>${bi(fill(T.speaks, { cs: esc(kid.speaks.cs), en: esc(kid.speaks.en) }))}</div>` : "") +
          `</div></div></div>` +
          (hasNotes ? `<div class="note"><b>${both(T.notes)}</b>${bi({ cs: esc(kid.notes.cs), en: esc(kid.notes.en) })}</div>` : "") +
          `</section>`;
      }

      h += `<h2>${both(T.parents)}</h2>`;
      CONFIG.parents.forEach(p => {
        h += `<div class="parent"><div class="row">` +
          btn("", `tel:${esc(p.phone)}`, I.phone, p.call) +
          (p.whatsapp ? btn("chat", `https://wa.me/${digits(p.phone)}`, I.chat, T.chat) : "") +
          `</div><div class="num">${esc(p.name)} · ${esc(p.phone)}</div></div>`;
      });

      h += `<h2>${both(T.locT)}</h2><p class="hint">${both(T.locH)}</p>` +
        `<button class="btn loc" id="loc-btn" type="button">${I.aim}<span>${bi(T.locB)}</span></button>` +
        `<div id="loc-status"></div>` +
        `<div id="loc-panel"><div class="link" id="loc-link"></div>` +
        btn("chat", "#", I.chat, T.locWA, "loc-wa") +
        btn("soft", "#", I.chat, T.locSMS, "loc-sms") +
        `<button class="btn soft" id="loc-copy" type="button">${I.copy}<span>${bi(T.locCp)}</span></button>` +
        `</div>`;

      if (CONFIG.hotel) {
        const H = CONFIG.hotel;
        h += `<h2>${both(T.stay)}</h2>` +
          `<section class="card"><div style="font-weight:700;font-size:20px">${esc(H.name)}</div><div class="num" style="margin-left:0">${esc(H.address)}</div></section>` +
          (H.phone ? btn("", `tel:${esc(H.phone)}`, I.phone, T.hotelB) : "") +
          (H.address ? btn("soft", `https://maps.google.com/?q=${encodeURIComponent(H.name + ", " + H.address)}`, I.pin, T.mapsB) : "");
      }
      if (CONFIG.email) h += btn("soft", `mailto:${esc(CONFIG.email)}`, I.mail, T.mailB);

      h += `<footer class="foot"><p>${bi(T.emerg)}</p><p>${bi(fill(T.stayW, pron))}</p><p class="thanks">${bi(T.thanks)}</p></footer>`;

      document.getElementById("app").innerHTML = h;
      if (kidName) document.title = kidName + " · " + document.title;

      /* "Send my location": get GPS, then show tappable WhatsApp / SMS / copy actions
         (rendered as links rather than auto-opened, so iOS doesn't block them as popups). */
      const status = document.getElementById("loc-status");
      const say = t => { status.textContent = t.cs + " / " + t.en; };
      document.getElementById("loc-btn").addEventListener("click", () => {
        if (!navigator.geolocation) { say(T.locF); return; }
        say(T.locW);
        navigator.geolocation.getCurrentPosition(pos => {
          const lat = pos.coords.latitude.toFixed(5), lng = pos.coords.longitude.toFixed(5);
          const maps = `https://maps.google.com/?q=${lat},${lng}`;
          const msg = (kidName || "Vaše dítě / Your child") + " – jsme tady / we are here: " + maps;
          const to = CONFIG.parents[CONFIG.locationTo] || CONFIG.parents[0];
          document.getElementById("loc-link").textContent = maps;
          document.getElementById("loc-wa").href = `https://wa.me/${digits(to.phone)}?text=${encodeURIComponent(msg)}`;
          // "?&body=" is the cross-platform form (iOS wants "&body", Android wants "?body").
          document.getElementById("loc-sms").href = `sms:${to.phone}?&body=${encodeURIComponent(msg)}`;
          document.getElementById("loc-copy").onclick = () => copyText(maps);
          status.textContent = "";
          document.getElementById("loc-panel").classList.add("show");
        }, () => say(T.locF), { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
      });

      function copyText(text) {
        const done = () => say(T.copied);
        const legacy = () => {
          const ta = document.createElement("textarea");
          ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
          document.body.appendChild(ta); ta.select();
          try { document.execCommand("copy"); done(); } catch (e) { }
          document.body.removeChild(ta);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, legacy);
        else legacy();
      }
    })();
  </script>
</body>

</html>
